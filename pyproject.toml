[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "aiosynologysrm"
dynamic = ["version"]
description = "Async Python client for the Synology Router Manager (SRM) Web API - read-only, typed, for mesh and standalone setups"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "eizedev" }]
keywords = ["synology", "srm", "router", "rt2600ac", "mr2200ac", "rt6600ax", "wrx560", "asyncio", "aiohttp", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.10"]

[project.urls]
Homepage = "https://github.com/eizedev/aiosynologysrm"
Issues = "https://github.com/eizedev/aiosynologysrm/issues"
Changelog = "https://github.com/eizedev/aiosynologysrm/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/aiosynologysrm/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["aiosynologysrm"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "PT", "C4", "PL", "D"]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "PLR0913", # the client constructor takes the documented connection options
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "S105", "S106"]
"scripts/**" = ["D", "T201", "S603", "S607"]
