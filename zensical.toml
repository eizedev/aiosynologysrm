[project]
site_name = "aiosynologysrm"
site_description = "Async, read-only Python client for Synology SRM routers and access points"
site_url = "https://aiosynologysrm.eize.dev/"
repo_url = "https://github.com/eizedev/aiosynologysrm"
repo_name = "eizedev/aiosynologysrm"
edit_uri = "edit/main/docs/"
copyright = "MIT licensed · Unofficial, not affiliated with Synology Inc."
extra_css = ["assets/site.css"]
nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "What it can read" = "reading.md" },
  { "Errors" = "errors.md" },
  { "Diagnostics" = "diagnostics.md" },
  { "Compatibility" = "compatibility.md" },
  { "Design" = "design.md" },
]

[project.theme]
language = "en"
logo = "assets/icon.svg"
favicon = "assets/icon.svg"
# Fonts are self-hosted in assets/site.css; nothing is loaded from Google.
font = false
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
