name: Dependabot auto-merge

# Turns on auto-merge for Dependabot patch and minor updates. GitHub then merges the pull
# request only after every required check has passed. Major updates always wait for a human.
# Off until the repository variable DEPENDABOT_AUTOMERGE is set to "true".

on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && vars.DEPENDABOT_AUTOMERGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
