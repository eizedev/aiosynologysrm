name: Model or firmware report
description: Tell us whether the library works with your router and firmware.
labels: ["compatibility"]
body:
  - type: input
    id: model
    attributes:
      label: Router model
      placeholder: "RT6600ax"
    validations:
      required: true
  - type: input
    id: srm
    attributes:
      label: SRM version
      description: Control Panel, Info Center
      placeholder: "SRM 1.3.1-9346 Update 9"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Operating mode
      options: ["router", "mesh point", "standalone access point"]
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: get_system_info()
        - label: get_utilization()
        - label: get_network_devices()
  - type: textarea
    id: notes
    attributes:
      label: Errors or odd values (redacted)
