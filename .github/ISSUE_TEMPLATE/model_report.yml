name: Model or firmware report
description: Tell us whether the library works with your router, firmware and setup.
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Reports from devices and setups that are not tested yet help most: other models, other SRM
        versions, and mesh setups. See the
        [compatibility page](https://aiosynologysrm.eize.dev/compatibility/).
        Please replace MAC addresses, IP addresses and device names before posting
        (e.g. `02:00:00:00:00:01`, `192.0.2.1`).
  - type: input
    id: model
    attributes:
      label: Router model
      placeholder: "RT6600ax"
    validations:
      required: true
  - type: input
    id: srm
    attributes:
      label: SRM version
      description: Control Panel, Info Center
      placeholder: "SRM 1.3.1-9346 Update 9"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Operating mode of the device you connected to
      options:
        - "router without mesh points"
        - "router with mesh points"
        - "mesh point"
        - "standalone access point"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aiosynologysrm version
      description: "`pip show aiosynologysrm`"
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      description: Tick what returned sensible data.
      options:
        - label: get_system_info()
        - label: get_utilization()
        - label: get_network_devices()
        - label: get_topology()
        - label: get_connection_status()
        - label: get_external_ip()
        - label: get_ipv6_prefixes()
        - label: get_dhcp_servers()
        - label: get_dhcp_clients()
        - label: get_dhcp_reservations()
        - label: get_firewall_rules()
        - label: get_firewall_hit_counts()
        - label: get_forward_rules()
        - label: get_port_forwards()
        - label: get_port_triggers()
        - label: get_allow_srm_from_wan()
        - label: get_firewall_conf()
        - label: get_forward_conf()
        - label: get_auto_block()
        - label: get_wifi_radio_settings()
        - label: get_wifi_radio_status()
        - label: get_wifi_devices()
        - label: get_eth_port_info()
        - label: get_mesh_nodes()
        - label: get_usb_volumes()
        - label: get_usb_volumes()
  - type: textarea
    id: diagnostics
    attributes:
      label: Output of `aiosynologysrm-diagnostics <router> --user <admin>`
      description: It contains no addresses or names (https://aiosynologysrm.eize.dev/diagnostics/); read it, then paste it.
      render: json
  - type: textarea
    id: notes
    attributes:
      label: Errors or odd values (redacted)
