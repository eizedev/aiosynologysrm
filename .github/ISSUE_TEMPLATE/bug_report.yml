name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste raw router output: it contains MAC addresses, IP addresses and
        device names. Replace them (e.g. `02:00:00:00:00:01`, `192.0.2.1`) before posting.
  - type: input
    id: version
    attributes:
      label: aiosynologysrm version
      description: "`pip show aiosynologysrm`"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Router model and SRM version
      placeholder: "RT2600ac, SRM 1.3.2-9366 Update 3"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Operating mode
      options:
        - "router without mesh points"
        - "router with mesh points"
        - "mesh point"
        - "standalone access point"
        - "not sure"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code and error (redacted)
      render: python
  - type: textarea
    id: diagnostics
    attributes:
      label: Output of `aiosynologysrm-diagnostics <router> --user <admin>`
      description: It contains no addresses or names (see the README); read it, then paste it.
      render: json
